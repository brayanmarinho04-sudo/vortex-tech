
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redefinir senha | Vortex Tech</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080d18;color:white;font-family:Arial,sans-serif;padding:20px;box-sizing:border-box}
main{width:min(100%,420px);padding:28px;background:#111a2a;border:1px solid #283750;border-radius:16px}
h1{color:#e6bd65}
input,button{width:100%;padding:13px;margin-top:12px;box-sizing:border-box;border-radius:8px;font-size:15px}
input{background:#080d18;color:white;border:1px solid #40516a}
button{background:#e6bd65;border:0;font-weight:bold;cursor:pointer}
#msg{white-space:pre-wrap;color:#b8d6ff}
</style>
</head>
<body>
<main>
<h1>VORTEX TECH</h1>
<h2>Crie sua nova senha</h2>
<p>Digite uma nova senha para acessar sua conta.</p>
<form id="form">
<input id="senha" type="password" minlength="8" autocomplete="new-password" placeholder="Nova senha (mínimo 8 caracteres)" required>
<input id="confirmar" type="password" minlength="8" autocomplete="new-password" placeholder="Confirme a nova senha" required>
<button id="btn">Salvar nova senha</button>
</form>
<p id="msg" role="status"></p>
</main>
<script>
const db = window.supabase.createClient(
  "https://bngxigbyxrksctylyanw.supabase.co",
  "sb_publishable_WYRvOzBLQuUDMPf_ZK9qmg_lvIXaHyo"
);

const msg = document.getElementById("msg");
let recoveryReady = false;

async function preparar() {
  const { data, error } = await db.auth.getSession();

  if (error) {
    msg.textContent = "Não foi possível validar a recuperação. Solicite um novo link.";
    return;
  }

  if (data.session) {
    recoveryReady = true;
    return;
  }

  // Compatibilidade com links de recuperação que usam tokens no fragmento.
  const hash = new URLSearchParams(location.hash.slice(1));
  const access_token = hash.get("access_token");
  const refresh_token = hash.get("refresh_token");
  const type = hash.get("type");

  if (access_token && refresh_token && type === "recovery") {
    const result = await db.auth.setSession({ access_token, refresh_token });
    if (!result.error) {
      recoveryReady = true;
      return;
    }
  }

  msg.textContent = "Link inválido ou expirado. Solicite uma nova recuperação de senha.";
}

document.getElementById("form").addEventListener("submit", async event => {
  event.preventDefault();

  if (!recoveryReady) {
    msg.textContent = "Valide o link de recuperação antes de continuar.";
    return;
  }

  const senha = document.getElementById("senha").value;
  const confirmar = document.getElementById("confirmar").value;

  if (senha.length < 8) {
    msg.textContent = "A senha deve ter pelo menos 8 caracteres.";
    return;
  }

  if (senha !== confirmar) {
    msg.textContent = "As senhas não coincidem.";
    return;
  }

  const btn = document.getElementById("btn");
  btn.disabled = true;
  msg.textContent = "Salvando...";

  try {
    const { error } = await db.auth.updateUser({ password: senha });
    if (error) throw error;

    msg.textContent = "Senha alterada com sucesso. Você já pode entrar no painel.";
    await db.auth.signOut();
  } catch (error) {
    console.error(error);
    msg.textContent = "Não foi possível alterar a senha. Solicite um novo link e tente novamente.";
  } finally {
    btn.disabled = false;
  }
});

preparar();
</script>
</body>
</html>
